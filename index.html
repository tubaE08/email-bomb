<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email bomber — Efty</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6ebf1;
      color: #334155;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      background: #e6ebf1;
      box-shadow: 14px 14px 28px #c5cdd6, -14px -14px 28px #ffffff;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 250px;
      height: 250px;
      top: 10%;
      left: calc(50% - 270px);
    }

    body::after {
      width: 210px;
      height: 210px;
      bottom: 10%;
      right: calc(50% - 250px);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: #e6ebf1;
      border-radius: 34px;
      padding: 36px 28px 28px;
      box-shadow: 16px 16px 32px #c2cad3, -16px -16px 32px #ffffff;
      text-align: center;
    }

    .logo-badge {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e6ebf1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 8px 8px 16px #c2cad3, -8px -8px 16px #ffffff;
      position: relative;
    }

    .logo-badge::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      box-shadow: inset 3px 3px 6px #c8d0d9, inset -3px -3px 6px #ffffff;
    }

    .logo-badge svg {
      width: 38px;
      height: 38px;
      z-index: 1;
    }

    h2 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    p.sub {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 26px;
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    .neumorphic-input {
      width: 100%;
      padding: 15px 18px;
      border: none;
      outline: none;
      border-radius: 16px;
      background: #e6ebf1;
      color: #1e293b;
      font-size: 0.94rem;
      box-shadow: inset 5px 5px 10px #c2cad3, inset -5px -5px 10px #ffffff;
      transition: box-shadow 0.2s ease;
    }

    .neumorphic-input::placeholder {
      color: #8b98a9;
    }

    .neumorphic-input:focus {
      box-shadow: inset 7px 7px 14px #bac3cd, inset -7px -7px 14px #ffffff;
    }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 25px;
      background: #e6ebf1;
      color: #2563eb;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 7px 7px 14px #c2cad3, -7px -7px 14px #ffffff;
      transition: all 0.18s ease;
    }

    .submit-btn:hover:not(:disabled) {
      color: #1d4ed8;
      box-shadow: 9px 9px 18px #bcc5cf, -9px -9px 18px #ffffff;
      transform: translateY(-1px);
    }

    .submit-btn:active:not(:disabled) {
      box-shadow: inset 5px 5px 10px #c2cad3, inset -5px -5px 10px #ffffff;
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .divider {
      margin: 24px 0 16px;
      font-size: 0.78rem;
      color: #7c8b9e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #cbd5e1, transparent);
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .social-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #e6ebf1;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #475569;
      cursor: pointer;
      box-shadow: 6px 6px 12px #c2cad3, -6px -6px 12px #ffffff;
      transition: all 0.18s ease;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 8px 8px 15px #bcc5cf, -8px -8px 15px #ffffff;
    }

    .social-btn:active {
      box-shadow: inset 4px 4px 8px #c2cad3, inset -4px -4px 8px #ffffff;
      transform: translateY(0);
    }

    .social-btn.fb:hover {
      color: #1877f2;
    }

    .social-btn.ig:hover {
      color: #e1306c;
    }

    .social-btn.policy:hover {
      color: #0284c7;
    }

    .footer-credit {
      font-size: 0.8rem;
      color: #64748b;
    }

    .footer-credit span {
      color: #2563eb;
      font-weight: 700;
    }

    .swal2-popup.neu-swal {
      background: #e6ebf1 !important;
      border-radius: 26px !important;
      box-shadow: 12px 12px 24px #b8c1cc, -12px -12px 24px #ffffff !important;
      color: #1e293b !important;
      padding: 24px !important;
    }

    .swal2-title {
      color: #1e293b !important;
      font-size: 1.25rem !important;
    }

    .swal2-html-container {
      color: #475569 !important;
      font-size: 0.9rem !important;
      line-height: 1.5 !important;
    }

    .swal2-confirm.neu-confirm {
      background: #e6ebf1 !important;
      color: #2563eb !important;
      font-weight: 700 !important;
      border-radius: 20px !important;
      padding: 10px 28px !important;
      box-shadow: 5px 5px 10px #c2cad3, -5px -5px 10px #ffffff !important;
      border: none !important;
    }

    .swal2-confirm.neu-confirm:active {
      box-shadow: inset 4px 4px 8px #c2cad3, inset -4px -4px 8px #ffffff !important;
    }

    .api-response-box {
      text-align: left;
      background: #dce2ea;
      padding: 12px;
      border-radius: 12px;
      overflow-x: auto;
      font-size: 0.82rem;
      color: #1e293b;
      box-shadow: inset 3px 3px 6px #c2cad3, inset -3px -3px 6px #ffffff;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dev-badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="mailGrad" x1="2" y1="4" x2="22" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#1D4ED8" />
          </linearGradient>
        </defs>
        <rect x="2" y="4" width="20" height="16" rx="4" fill="url(#mailGrad)" />
        <path
          d="M3.5 6.5L10.8 12.1C11.5 12.6 12.5 12.6 13.2 12.1L20.5 6.5"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <h2>Email Bomber</h2>
    <p class="sub">Enter target email & amount to process</p>

    <form id="apiForm">
      <div class="input-group">
        <input
          type="email"
          id="email"
          name="email"
          class="neumorphic-input"
          placeholder="Email Address"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="number"
          id="amount"
          name="amount"
          class="neumorphic-input"
          placeholder="Amount (e.g. 10)"
          min="1"
          required
        />
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">SUBMIT</button>
    </form>

    <div class="divider">Developer Contact</div>

    <div class="social-row">
      <a
        href="https://www.facebook.com/share/1CYjkMi4y7/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
        class="social-btn fb"
        title="Facebook Contact"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/>
        </svg>
      </a>

      <a
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="social-btn ig"
        title="Instagram Contact"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <button
        type="button"
        id="policyBtn"
        class="social-btn policy"
        title="Privacy Policy"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </button>
    </div>

    <div class="footer-credit">
      Developed by <span>Efty</span>
    </div>
  </div>

  <script>
    function showPrivacyPolicy() {
      Swal.fire({
        title: "Privacy Policy & Terms",
        html: `
          <div style="text-align: left; font-size: 0.86rem;">
            <p style="margin-bottom: 8px;">• <b>Educational Purpose:</b> This tool is strictly built for testing and educational purposes only.</p>
            <p style="margin-bottom: 8px;">• <b>No Data Storage:</b> We do not store or log any email addresses or request data on our server.</p>
            <p>• <b>User Responsibility:</b> Do not misuse this API tool for unauthorized or harmful activities.</p>
          </div>
        `,
        icon: "info",
        confirmButtonText: "I Agree",
        allowOutsideClick: false,
        customClass: {
          popup: "neu-swal",
          confirmButton: "neu-confirm"
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      showPrivacyPolicy();
    });

    document.getElementById("policyBtn").addEventListener("click", showPrivacyPolicy);

    const form = document.getElementById("apiForm");
    const submitBtn = document.getElementById("submitBtn");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const amount = document.getElementById("amount").value.trim();

      if (!email || !amount) return;

      const endpoint = `/api/proxy?email=${encodeURIComponent(
        email
      )}&amount=${encodeURIComponent(amount)}`;

      submitBtn.disabled = true;
      submitBtn.textContent = "SENDING...";

      Swal.fire({
        title: "Sending Request...",
        text: `Processing ${amount} request(s) for ${email}`,
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        },
        customClass: {
          popup: "neu-swal"
        }
      });

      try {
        const res = await fetch(endpoint, { method: "GET" });
        const rawText = await res.text();

        let displayMsg = rawText.trim();
        let isSuccess = res.ok;

        try {
          const parsed = JSON.parse(rawText);
          displayMsg = JSON.stringify(parsed, null, 2);

          // Check JSON flags if API returns HTTP 200 with error payload
          if (
            parsed.status === false ||
            parsed.success === false ||
            String(parsed.status).toLowerCase() === "error" ||
            String(parsed.status).toLowerCase() === "fail" ||
            String(parsed.status).toLowerCase() === "failed" ||
            parsed.error
          ) {
            isSuccess = false;
          } else if (
            parsed.status === true ||
            parsed.success === true ||
            String(parsed.status).toLowerCase() === "success" ||
            String(parsed.status).toLowerCase() === "ok"
          ) {
            isSuccess = true;
          }
        } catch (_) {
          // Plain text fallback check
          const lower = rawText.toLowerCase();
          if (
            !res.ok ||
            lower.includes("error") ||
            lower.includes("fail") ||
            lower.includes("invalid") ||
            lower.trim() === ""
          ) {
            isSuccess = false;
          }
        }

        if (isSuccess) {
          Swal.fire({
            title: "Send Success",
            html: `
              <div style="font-size: 0.85rem; color: #334155;">API Response:</div>
              <pre class="api-response-box">${escapeHtml(displayMsg)}</pre>
              <div class="dev-badge">Developer: Efty</div>
            `,
            icon: "success",
            confirmButtonText: "OK",
            customClass: {
              popup: "neu-swal",
              confirmButton: "neu-confirm"
            }
          });
        } else {
          Swal.fire({
            title: "Send Failed",
            html: `
              <div style="font-size: 0.85rem; color: #334155;">API Response:</div>
              <pre class="api-response-box">${escapeHtml(displayMsg || "No response from API")}</pre>
              <div class="dev-badge">Developer: Efty</div>
            `,
            icon: "error",
            confirmButtonText: "Close",
            customClass: {
              popup: "neu-swal",
              confirmButton: "neu-confirm"
            }
          });
        }
      } catch (err) {
        Swal.fire({
          title: "Send Failed",
          html: `
            <pre class="api-response-box">${escapeHtml(err.message)}</pre>
            <div class="dev-badge">Developer: Efty</div>
          `,
          icon: "error",
          confirmButtonText: "Close",
          customClass: {
            popup: "neu-swal",
            confirmButton: "neu-confirm"
          }
        });
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT";
      }
    });
  </script>
</body>
</html>
